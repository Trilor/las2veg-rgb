[project]
name = "las2veg-rgb"
version = "0.1.0"
description = "LAS/LAZ point clouds to multi-band RGBA PMTiles for vegetation analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Trilor" },
]
dependencies = [
    "laspy[lazrs]>=2.5.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "click>=8.1",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
las2veg-preview = "las2veg_rgb.cli:preview"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/las2veg_rgb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
